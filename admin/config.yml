# ==============================================================================
# CONFIGURACIÓN DE SVELTIA CMS (Panel Externo para Morela Arte Floral)
# ==============================================================================
# Sveltia CMS guarda los cambios directamente en data.json vía GitHub.
backend:
  name: github
  repo: AlejandroSanchez-dev/Floristeria-morela-arte-florar
  branch: main

# Directorio donde se guardan las imágenes subidas desde el panel
media_folder: "img/uploads"
public_folder: "/img/uploads"

# Optimización automática de imágenes en Sveltia CMS a WebP
media_libraries:
  default:
    config:
      max_file_size: 15728640
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1200
          height: 1200

collections:
  - name: "configuracion_web"
    label: "Gestión de la Web"
    files:
      - name: "data"
        label: "Precios, Textos y Ofertas de Temporada"
        file: "data.json"
        format: "json"
        fields:
          # ==========================================
          # 1. OFERTAS DE TEMPORADA (BOTÓN + TEXTOS + PRECIOS)
          # ==========================================
          - label: "🌹 Ofertas de Temporada (Activar / Desactivar con un botón)"
            name: "campana"
            widget: "object"
            collapsed: false
            fields:
              - label: "Mostrar Ofertas de Temporada en la web"
                name: "activa"
                widget: "boolean"
                default: true
                hint: "Activa este botón para abrir las ofertas de temporada en la portada. Apágalo cuando termine la campaña."
              - label: "Temporada / Estilo de Color"
                name: "tema"
                widget: "select"
                default: "san_valentin"
                options:
                  - { label: "San Valentín (Tonos Burdeos y Rosa)", value: "san_valentin" }
                  - { label: "Día de la Madre (Tonos Lavanda y Rosa)", value: "dia_madre" }
                  - { label: "Comuniones (Tonos Ámbar y Dorado)", value: "comuniones" }
                  - { label: "Navidad (Tonos Verde Bosque y Oro)", value: "navidad" }
              - { label: "Etiqueta Superior", name: "etiqueta", widget: "string" }
              - { label: "Título de la Campaña", name: "titulo", widget: "string" }
              - { label: "Texto / Subtítulo", name: "subtitulo", widget: "text" }
              - { label: "Aviso de Fecha Límite", name: "fecha_limite", widget: "string", required: false }
              - label: "Mostrar desde (opcional)"
                name: "fecha_inicio"
                widget: "datetime"
                required: false
                format: "YYYY-MM-DD"
                date_format: "DD/MM/YYYY"
                time_format: false
                hint: "Si la rellenas, la campaña no aparece antes de esta fecha aunque esté activada."
              - label: "Ocultar automáticamente después de (opcional)"
                name: "fecha_fin"
                widget: "datetime"
                required: false
                format: "YYYY-MM-DD"
                date_format: "DD/MM/YYYY"
                time_format: false
                hint: "Recomendado: el día siguiente a esta fecha la campaña desaparece sola, aunque se te olvide apagarla."
              - label: "Ofertas de Temporada (Precios y Textos)"
                name: "ofertas"
                widget: "list"
                summary: "{{fields.nombre}} — {{fields.precio}}"
                fields:
                  - { label: "Nombre de la Oferta", name: "nombre", widget: "string" }
                  - { label: "Descripción", name: "descripcion", widget: "text" }
                  - { label: "Precio Oferta (ej: 49 €)", name: "precio", widget: "string" }
                  - label: "Precio Anterior Tachado (opcional)"
                    name: "precio_antes"
                    widget: "string"
                    required: false
                    hint: "Por ley debe ser el precio MÁS BAJO que ha tenido este producto en los 30 días anteriores a la oferta. Si no es así, déjalo vacío."
                  - { label: "Etiqueta Destacada (ej: El más vendido)", name: "tag", widget: "string", required: false }
                  - { label: "Fotografía", name: "imagen", widget: "image" }
                  - label: "¿Es una imagen de inspiración (no es un trabajo nuestro)?"
                    name: "imagen_orientativa"
                    widget: "boolean"
                    default: false
                    hint: "Actívalo si la foto es de internet o de un banco de imágenes. La web mostrará «Imagen orientativa» para no inducir a error."

          # ==========================================
          # 2. PRECIOS Y TEXTOS DE LA CALCULADORA NUPCIAL
          # ==========================================
          - label: "🧮 Precios y Textos de la Calculadora Nupcial"
            name: "pack_items"
            widget: "list"
            collapsed: true
            allow_add: false
            summary: "{{fields.nombre}} ({{fields.precio}} €)"
            fields:
              - { label: "ID (NO TOCAR)", name: "id", widget: "hidden" }
              - { label: "Nombre de la Pieza", name: "nombre", widget: "string" }
              - { label: "Descripción Breve", name: "descripcion", widget: "string" }
              - { label: "Precio (€, IVA incluido)", name: "precio", widget: "number", value_type: "int" }
              - { label: "Icono (NO TOCAR)", name: "svg", widget: "hidden" }
              - { label: "Cantidad Inicial (NO TOCAR)", name: "cantidad_inicial", widget: "hidden" }
              - { label: "Color Activo (NO TOCAR)", name: "bg_active", widget: "hidden" }
              - { label: "Color Icono (NO TOCAR)", name: "icon_bg", widget: "hidden" }

          # ==========================================
          # 3. PRECIOS Y TEXTOS DEL CATÁLOGO PRINCIPAL
          # ==========================================
          - label: "📸 Catálogo y Galería (Precios, Textos y Fotos)"
            name: "galeria"
            widget: "list"
            collapsed: true
            summary: "{{fields.titulo}} — {{fields.precio}}"
            fields:
              - { label: "Título de la Pieza", name: "titulo", widget: "string" }
              - label: "Categoría"
                name: "categoria"
                widget: "select"
                options:
                  - { label: "Ramos de Novia", value: "novias" }
                  - { label: "Cúpulas y Réplicas", value: "cupulas" }
                  - { label: "Tocados y Comunión", value: "tocados" }
                  - { label: "Prendidos, Damas y Coche", value: "detalles" }
              - { label: "Etiqueta Superior", name: "etiqueta", widget: "string", default: "Trabajo Real Morela" }
              - { label: "Color de Etiqueta (NO TOCAR)", name: "badgeColor", widget: "hidden", default: "bg-atelier-berry text-white" }
              - { label: "Precio Visible, IVA incluido (ej: Desde 95 €)", name: "precio", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "text" }
              - { label: "Fotografía", name: "imagen", widget: "image" }
              - label: "¿Es una imagen de inspiración (no es un trabajo nuestro)?"
                name: "imagen_orientativa"
                widget: "boolean"
                default: false
                hint: "Actívalo si la foto no es de una pieza hecha en el taller. Lo ideal es ir sustituyéndolas por fotos propias."

          # ==========================================
          # 4. TEXTOS DE CONTACTO Y HORARIOS
          # ==========================================
          - label: "📍 Contacto y Horarios"
            name: "contacto"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Teléfono visible", name: "telefono", widget: "string" }
              - { label: "WhatsApp (34 delante, sin + ni espacios)", name: "whatsapp", widget: "string" }
              - { label: "Dirección del Taller", name: "direccion", widget: "string" }
              - { label: "Horario Lunes a Jueves", name: "horario_lv", widget: "string" }
              - { label: "Horario Viernes / Verano", name: "horario_sab", widget: "string" }
              - { label: "Email de contacto (se muestra en la web)", name: "email", widget: "string", required: false }

          # ==========================================
          # 5. ENVÍOS
          # ==========================================
          - label: "🚚 Envíos"
            name: "envio"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Coste del envío (€, ej: 3,99)", name: "coste", widget: "string" }
              - { label: "Envío gratis a partir de (€)", name: "gratis_desde", widget: "number", value_type: "int" }
              - { label: "Zona de envío", name: "zona", widget: "string", default: "España peninsular" }
              - { label: "Plazo de entrega habitual", name: "plazo", widget: "string" }

          # ==========================================
          # 6. SOBRE MORELA
          # ==========================================
          - label: "🌿 Sobre Morela (quiénes somos)"
            name: "sobre"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Mostrar la sección", name: "activa", widget: "boolean", default: true }
              - label: "Texto"
                name: "texto"
                widget: "text"
                hint: "Cuenta quién está detrás del taller, desde cuándo y cómo trabajáis. Deja una línea en blanco para separar párrafos."
              - { label: "Fotografía (idealmente del taller o de la artesana)", name: "imagen", widget: "image" }

          # ==========================================
          # 7. DATOS LEGALES (OBLIGATORIOS POR LEY)
          # ==========================================
          - label: "⚖️ Datos legales del titular (obligatorio)"
            name: "legal"
            widget: "object"
            collapsed: true
            hint: "Aparecen en el Aviso Legal, la Política de Privacidad, las Condiciones de venta y el pie de la web. Lo exige la LSSI (art. 10) y el RGPD."
            fields:
              - { label: "Nombre y apellidos del titular o razón social", name: "titular", widget: "string" }
              - { label: "NIF / CIF", name: "nif", widget: "string" }
              - { label: "Email para clientes y para ejercer derechos de privacidad", name: "email", widget: "string" }
              - label: "Datos del Registro Mercantil (solo si es una sociedad)"
                name: "registro"
                widget: "string"
                required: false
                hint: "Ej: Registro Mercantil de Albacete, Tomo X, Folio Y, Hoja AB-1234. Déjalo vacío si eres autónoma."
              - label: "Fecha de última actualización de los textos legales"
                name: "actualizado"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "DD/MM/YYYY"
                time_format: false

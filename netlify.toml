[build]
  publish = "."
  # Compila el CSS de Tailwind (antes se usaba el CDN de pruebas, no apto para producción)
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# La copia antigua de la portada redirige a la principal (evita contenido duplicado)
[[redirects]]
  from = "/morela.html"
  to = "/"
  status = 301

# Panel de administración (Sveltia CMS)
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# data.json siempre actualizado tras editar desde el panel
[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Recursos estáticos con caché larga (las fuentes no cambian)
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El panel y la página de "gracias" no deben aparecer en Google
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/gracias.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Cabeceras de seguridad
# DEMO: X-Robots-Tag evita que Google indexe la propuesta. Quitar al publicar con el dominio propio.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()"
